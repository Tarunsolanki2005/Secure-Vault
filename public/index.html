<!DOCTYPE html>
<html>
<head>
    <title>SecureVault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hero">
    <h1 class="logo">SecureVault</h1>
    <p class="tagline">Store your passwords securely with encryption 🔐</p>
</div>

<div class="auth-wrapper">

    <div id="loginSection" class="container">
        <h3>Login</h3>
        <input id="loginUsername" placeholder="Username">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="showRegister()">Register</button>
    </div>

    <div id="registerSection" class="container" style="display:none;">
        <h3>Register</h3>
        <input id="registerUsername" placeholder="Username">
        <input id="registerPassword" type="password" placeholder="Password">
        <button onclick="register()">Register</button>
        <button onclick="showLogin()">Back</button>
    </div>

</div>

<div id="dashboardSection" style="display:none;">
    <input id="website" placeholder="Website">
    <input id="username" placeholder="Username">

    <input id="password" type="password" placeholder="Password">

    <button onclick="generatePassword()">Generate</button>

    <button onclick="savePassword()">Save Password</button>
    <button onclick="loadPasswords()">Load Passwords</button>
    <button onclick="logout()">Logout</button>

    <input id="searchBar" placeholder="Search..." onkeyup="filterPasswords()">

    <div id="list"></div>
</div>

<div id="toast"></div>

<script src="script.js"></script>

<script>
/* ✅ GLOBAL API FIX (IMPORTANT) */
const API_URL =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "https://securevault-backend-xpsb.onrender.com";

/* UI SWITCH */
function showRegister(){
    loginSection.style.display="none";
    registerSection.style.display="block";
}

function showLogin(){
    registerSection.style.display="none";
    loginSection.style.display="block";
}

/* LOGIN */
async function login(){
    try{
        const res = await fetch(`${API_URL}/api/auth/login`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                username:loginUsername.value,
                password:loginPassword.value
            })
        });

        const data = await res.json();

        if(!res.ok){
            alert(data.message || "Login failed ❌");
            return;
        }

        localStorage.setItem("token",data.token);

        loginSection.style.display="none";
        registerSection.style.display="none";
        dashboardSection.style.display="block";

        showToast("Login success ✅");

    }catch(err){
        console.log(err);
        alert("Server error ❌");
    }
}

/* REGISTER */
async function register(){
    try{
        const res = await fetch(`${API_URL}/api/auth/register`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                username:registerUsername.value,
                password:registerPassword.value
            })
        });

        const data = await res.json();

        if(!res.ok){
            alert(data.message || "Register failed ❌");
            return;
        }

        showToast("Registered ✅");
        showLogin();

    }catch(err){
        console.log(err);
        alert("Server error ❌");
    }
}

/* LOGOUT */
function logout(){
    localStorage.removeItem("token");
    dashboardSection.style.display="none";
    loginSection.style.display="block";
}
</script>

</body>
</html>
